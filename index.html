<!DOCTYPE html>
<html>

<head>
<title>SMART GENIE</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

/* SAME CSS — NO CHANGE */

body{
font-family:"Segoe UI",sans-serif;
margin:0;
display:flex;
height:100vh;
overflow:hidden;
background:#1e1e1e;
}

.sidebar{
width:260px;
background:#171717;
color:white;
padding:10px;
overflow-y:auto;
border-right:1px solid #333;
transition:0.3s;
}

.newchat{
width:100%;
padding:10px;
margin-bottom:15px;
background:#10a37f;
border:none;
border-radius:8px;
color:white;
font-weight:600;
cursor:pointer;
}

.newchat:hover{
background:#0e8e6f;
}

.chat-item{
padding:10px;
border-radius:8px;
cursor:pointer;
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:5px;
}

.chat-item:hover{
background:#2a2a2a;
}

.chat-item span{
font-size:14px;
}

.menu{
cursor:pointer;
padding:5px;
}

.dropdown{
display:none;
position:absolute;
background:#2a2a2a;
border-radius:6px;
padding:5px;
margin-top:5px;
}

.dropdown div{
padding:8px;
cursor:pointer;
border-radius:5px;
}

.dropdown div:hover{
background:#444;
}

@media (max-width:768px){
.sidebar{
position:fixed;
left:-260px;
top:0;
height:100%;
z-index:20;
}
.sidebar.active{
left:0;
}
.chat-input{
width:90%;
}
}

.menu-btn{
display:none;
}

@media (max-width:768px){
.menu-btn{
display:block;
position:fixed;
top:10px;
left:10px;
z-index:30;
background:#2a2a2a;
color:white;
border:none;
padding:8px;
border-radius:5px;
cursor:pointer;
}
}

.main{
flex:1;
display:flex;
flex-direction:column;
position:relative;
width:100%;
}

#chatbox{
flex:1;
overflow-y:auto;
padding:20px;
padding-bottom:120px;
scroll-behavior:smooth;
}

.user,.bot{
margin:12px;
display:flex;
}

.user{justify-content:flex-end;}
.bot{justify-content:flex-start;}

.msg{
padding:12px;
border-radius:12px;
max-width:65%;
line-height:1.5;
}

.user .msg{
background:#007bff;
color:white;
}

.bot .msg{
background:#2d2d2d;
color:white;
}

.copy-btn{
font-size:12px;
margin-top:5px;
cursor:pointer;
opacity:0.6;
}

.copy-btn:hover{
opacity:1;
}

.loader{
border:3px solid #444;
border-top:3px solid #fff;
border-radius:50%;
width:16px;
height:16px;
animation:spin 1s linear infinite;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

.input-wrapper{
position:absolute;
left:0;
width:100%;
display:flex;
justify-content:center;
z-index:10;
transition:0.3s;
}

.center{
top:50%;
transform:translateY(-50%);
}

.bottom{
bottom:20px;
}

.chat-input{
display:flex;
background:#2a2a2a;
border-radius:30px;
padding:12px;
width:60%;
}

#message{
flex:1;
border:none;
background:transparent;
color:white;
outline:none;
font-size:15px;
}

.send-btn{
background:#10a37f;
border:none;
border-radius:50%;
width:40px;
height:40px;
cursor:pointer;
color:white;
font-size:16px;
}

.welcome{
text-align:center;
margin-top:20%;
opacity:0.7;
}

</style>
</head>

<body>

<button class="menu-btn" onclick="toggleSidebar()">☰</button>

<div class="sidebar">
<h3>Your Chats</h3>
<button class="newchat" onclick="newChat()">New Chat</button>
<div id="chatList"></div>
</div>

<div class="main">

<div id="chatbox"></div>

<div id="inputArea" class="input-wrapper center">
<div class="chat-input">
<input id="message" placeholder="Ask anything...">
<button class="send-btn" onclick="sendMessage()">➤</button>
</div>
</div>

</div>

<script>

/* SAME JS — IMAGE FUNCTION REMOVED */

function toggleSidebar(){
document.querySelector(".sidebar").classList.toggle("active")
}

function getSessionId(){
let id = localStorage.getItem("session_id")
if(!id){
id = crypto.randomUUID()
localStorage.setItem("session_id", id)
}
return id
}

let sessionId = getSessionId()
let currentChat=null

function scrollBottom(){
chatbox.scrollTop=chatbox.scrollHeight
}

function setCenter(){
inputArea.className="input-wrapper center"
}

function setBottom(){
inputArea.className="input-wrapper bottom"
}

function showWelcome(){
chatbox.innerHTML=`<div class="welcome">
<h2>✨ Smart Genie</h2>
<p>Ask anything and explore AI</p>
</div>`
setCenter()
}

function newChat(){
fetch("/new_chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({session_id:sessionId})
})
.then(r=>r.json())
.then(d=>{
currentChat=d.chat_id
showWelcome()
loadChats()
})
}

function loadChats(){
fetch("/get_chats",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({session_id:sessionId})
})
.then(r=>r.json())
.then(data=>{
chatList.innerHTML=""
data.forEach(c=>{
chatList.innerHTML+=`
<div class="chat-item">
<span onclick="loadChat(${c.id})">${c.title}</span>
<span class="menu" onclick="toggleMenu(${c.id})">⋮</span>
<div class="dropdown" id="menu${c.id}">
<div onclick="renameChat(${c.id})"> Rename</div>
<div onclick="deleteChat(${c.id})"> Delete</div>
</div>
</div>`
})
})
}

function toggleMenu(id){
let m=document.getElementById("menu"+id)
m.style.display = m.style.display==="block"?"none":"block"
}

function renameChat(id){
let newTitle = prompt("Enter new chat title:")
if(!newTitle) return

fetch("/rename_chat/"+id,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({title:newTitle})
})
.then(()=>{
loadChats()
})
}

function deleteChat(id){
if(!confirm("Delete this chat?")) return

fetch("/delete_chat/"+id,{method:"POST"})
.then(()=>{
loadChats()
showWelcome()
})
}

function loadChat(id){
currentChat=id

fetch("/load_chat/"+id)
.then(r=>r.json())
.then(data=>{
chatbox.innerHTML=""

if(data.length===0){
setCenter()
}else{
setBottom()
}

if(window.innerWidth < 768){
document.querySelector(".sidebar").classList.remove("active")
}

data.forEach(m=>{
if(m.role==="user"){
addUserMessage(m.message)
}else{
addBotMessage(m.message)
}
})

scrollBottom()
})
}

function addUserMessage(msg){
chatbox.innerHTML+=`
<div class="user">
<div class="msg">${msg}</div>
</div>`
}

function addBotMessage(msg){
chatbox.innerHTML+=`
<div class="bot">
<div>
<div class="msg">${marked.parse(msg)}</div>
<div class="copy-btn" onclick="copyText(\`${msg}\`)">⧉ Copy</div>
</div>
</div>`
}

function copyText(text){
navigator.clipboard.writeText(text)
alert("Copied!")
}

function sendMessage(){

let msg=message.value.trim()
if(!msg || !currentChat) return

setBottom()

addUserMessage(msg)
message.value=""

let typingDiv=document.createElement("div")
typingDiv.className="bot"
typingDiv.innerHTML=`<div class="msg"><div class="loader"></div></div>`
chatbox.appendChild(typingDiv)

scrollBottom()

fetch("/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
message:msg,
chat_id:currentChat
})
})
.then(r=>r.json())
.then(d=>{

typingDiv.innerHTML=""

let i=0
let temp=""
let interval=setInterval(()=>{
if(i<d.reply.length){
temp+=d.reply[i]
typingDiv.innerHTML=`
<div>
<div class="msg">${marked.parse(temp)}</div>
<div class="copy-btn" onclick="copyText(\`${d.reply}\`)">⧉ Copy</div>
</div>`
i++
scrollBottom()
}else{
clearInterval(interval)
}
},10)

loadChats()

})
}

message.addEventListener("keydown",e=>{
if(e.key==="Enter" && !e.shiftKey){
e.preventDefault()
sendMessage()
}
})

loadChats()
newChat()

</script>

</body>
</html>
