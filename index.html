<!DOCTYPE html>
<html>

<head>
<title>SMART GENIE</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

body{
font-family:"Segoe UI",sans-serif;
margin:0;
display:flex;
height:100vh;
background:#ffffff;
}

/* ---------- SIDEBAR ---------- */

.sidebar{
width:260px;
background:#f7f7f8;
color:black;
padding:10px;
overflow-y:auto;
border-right:1px solid #ddd;
transition:0.3s;
}

/* MOBILE */
@media (max-width:768px){
.sidebar{
position:fixed;
left:-260px;
top:0;
height:100%;
z-index:20;
}
.sidebar.active{
left:0;
}
}

/* ---------- MENU BUTTON ---------- */

.menu-btn{
display:none;
}

@media (max-width:768px){
.menu-btn{
display:block;
position:fixed;
top:10px;
left:10px;
z-index:30;
background:white;
border:1px solid #ccc;
padding:8px;
border-radius:6px;
}
}

/* ---------- MAIN ---------- */

.main{
flex:1;
display:flex;
flex-direction:column;
height:100vh;
}

/* ---------- CHAT ---------- */

#chatbox{
flex:1;
overflow-y:auto;
padding:20px;
padding-bottom:120px;
}

/* ---------- MESSAGE ---------- */

.user,.bot{
margin:12px;
display:flex;
}

.user{justify-content:flex-end;}
.bot{justify-content:flex-start;}

.msg{
padding:12px;
border-radius:12px;
max-width:65%;
}

.user .msg{
background:#007bff;
color:white;
}

.bot .msg{
background:#f1f1f1;
color:black;
}

/* ---------- INPUT ---------- */

.input-wrapper{
position:fixed;
bottom:0;
left:0;
width:100%;
display:flex;
justify-content:center;
background:white;
border-top:1px solid #ddd;
padding:10px;
z-index:10;
}

.chat-input{
display:flex;
background:#f1f1f1;
border-radius:30px;
padding:12px;
width:60%;
}

@media (max-width:768px){
.chat-input{
width:90%;
}
}

#message{
flex:1;
border:none;
background:transparent;
outline:none;
font-size:15px;
}

.send-btn{
background:#10a37f;
border:none;
border-radius:50%;
width:40px;
height:40px;
cursor:pointer;
color:white;
}

/* ---------- DELETE ---------- */

.dropdown{
display:none;
background:white;
border:1px solid #ddd;
padding:5px;
border-radius:6px;
position:absolute;
}

.dropdown div{
padding:6px;
cursor:pointer;
}

.dropdown div:hover{
background:#eee;
}

</style>
</head>

<body>

<button class="menu-btn" onclick="toggleSidebar()">☰</button>

<div class="sidebar">
<h3>Your Chats</h3>
<button onclick="newChat()">+ New Chat</button>
<div id="chatList"></div>
</div>

<div class="main">

<div id="chatbox"></div>

<div id="inputArea" class="input-wrapper">
<div class="chat-input">
<input id="message" placeholder="Ask anything...">
<button class="send-btn" onclick="sendMessage()">➤</button>
</div>
</div>

</div>

<script>

/* SIDEBAR */
function toggleSidebar(){
document.querySelector(".sidebar").classList.toggle("active")
}

let currentChat=null

function scrollBottom(){
chatbox.scrollTop=chatbox.scrollHeight
}

/* CHAT */

function newChat(){
fetch("/new_chat",{method:"POST"})
.then(r=>r.json())
.then(d=>{
currentChat=d.chat_id
chatbox.innerHTML=""
loadChats()
})
}

function loadChats(){
fetch("/get_chats")
.then(r=>r.json())
.then(data=>{
chatList.innerHTML=""
data.forEach(c=>{
chatList.innerHTML+=`
<div style="position:relative">
<span onclick="loadChat(${c.id})">${c.title}</span>
<span onclick="toggleMenu(${c.id})">⋮</span>
<div class="dropdown" id="menu${c.id}">
<div onclick="deleteChat(${c.id})">Delete</div>
</div>
</div>`
})
})
}

function toggleMenu(id){
let m=document.getElementById("menu"+id)
m.style.display=m.style.display==="block"?"none":"block"
}

function deleteChat(id){
if(!confirm("Delete chat?")) return
fetch("/delete_chat/"+id,{method:"POST"})
.then(()=>loadChats())
}

function loadChat(id){
currentChat=id

fetch("/load_chat/"+id)
.then(r=>r.json())
.then(data=>{
chatbox.innerHTML=""

data.forEach(m=>{
if(m.role==="user"){
chatbox.innerHTML+=`<div class="user"><div class="msg">${m.message}</div></div>`
}else{
chatbox.innerHTML+=`<div class="bot"><div class="msg">${marked.parse(m.message)}</div></div>`
}
})

scrollBottom()

if(window.innerWidth<768){
document.querySelector(".sidebar").classList.remove("active")
}

})
}

/* SEND */

function sendMessage(){

let msg=message.value.trim()
if(!msg || !currentChat) return

chatbox.innerHTML+=`<div class="user"><div class="msg">${msg}</div></div>`
message.value=""

scrollBottom()

fetch("/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:msg,chat_id:currentChat})
})
.then(r=>r.json())
.then(d=>{
chatbox.innerHTML+=`<div class="bot"><div class="msg">${marked.parse(d.reply)}</div></div>`
scrollBottom()
loadChats()
})
}

message.addEventListener("keydown",e=>{
if(e.key==="Enter"){
e.preventDefault()
sendMessage()
}
})

loadChats()
newChat()

</script>

</body>
</html>
